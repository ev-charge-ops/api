name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ev_charge_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ev_charge_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ev_charge_ops
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/ev_charge_ops
      JWT_SECRET: ci-test-secret-not-used-anywhere-else
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: 7
      CORS_ORIGINS: http://localhost:5173
      APP_URL: http://localhost:5173
      MAIL_DRIVER: console
      GOOGLE_CLIENT_IDS: ci-web.apps.googleusercontent.com,ci-ios.apps.googleusercontent.com
      APPLE_CLIENT_IDS: io.softmoon.evchargeops,io.softmoon.evchargeops.web
      GOOGLE_WEB_CLIENT_ID: ci-web.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
